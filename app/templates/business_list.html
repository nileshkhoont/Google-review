{% extends "base.html" %}
{% block title %}My Businesses — MOVYA-Smart AI Review{% endblock %}

{% block content %}
<section class="business-list-page" data-requires-auth>
    <a href="/dashboard" class="back-link"><span class="back-arrow">❮</span> Back</a>

    <div class="dashboard-header">
        <h2>My Businesses</h2>
        <a href="/businesses/create?from=businesses" class="btn btn-primary">+ Create Business</a>
    </div>

    <div id="businessGrid" class="business-list">
        <p class="muted">Loading...</p>
    </div>

    <div id="emptyState" class="empty-state hidden">
        <p>You haven't created any businesses yet.</p>
        <a href="/businesses/create?from=businesses" class="btn btn-primary">Create your first business</a>
    </div>
</section>
{% endblock %}

{% block extra_scripts %}
<script src="/static/js/business.js?v={{ asset_version }}"></script>
{% endblock %}
