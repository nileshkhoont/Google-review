<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ReviewQR-AI{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    {% block extra_head %}{% endblock %}
</head>
<body>
    {% block navbar %}
    <nav class="navbar">
        <a href="/" class="brand">Review<span>QR</span>-AI</a>
        <div class="nav-links" id="navLinks">
            <!-- populated dynamically by app.js depending on auth state -->
        </div>
    </nav>
    {% endblock %}

    <main class="page-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>&copy; 2026 ReviewQR-AI. Collect more reviews, effortlessly.</p>
    </footer>

    <script src="/static/js/app.js"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
