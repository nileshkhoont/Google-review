<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MOVYA-Smart AI Review{% endblock %}</title>
    <link rel="icon" type="image/png" href="/brand/m.png">
    <link rel="stylesheet" href="/static/css/style.css">
    {% block extra_head %}{% endblock %}
</head>
<body>
    {% block navbar %}
    <nav class="navbar">
        <a href="/" class="brand"><img src="/brand/m.png" alt="" class="brand-logo">MOVYA-Smart <span>AI</span> Review</a>
        <div class="nav-links" id="navLinks">
            <!-- populated dynamically by app.js depending on auth state -->
        </div>
    </nav>
    {% endblock %}

    <main class="page-content">
        {% block content %}{% endblock %}
    </main>

    <script src="/static/js/app.js?v={{ asset_version }}"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
